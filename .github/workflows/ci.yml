# Intégration continue de la Pointeuse (CDC étape 7, ADR 002).
#  - tests      : à chaque push / pull request, sous Linux et Windows (Qt hors écran) ;
#  - construire : exécutables portables Linux et Windows (outils/construire.py), en artefacts ;
#  - publier    : sur un tag vX.Y.Z, release GitHub avec les deux archives.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Bibliothèques système pour Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Installation
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

  construire:
    needs: tests
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Linux : Ubuntu 22.04 pour une glibc ancienne → l'exécutable tourne aussi sur les versions récentes.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Bibliothèques système à embarquer (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Installation
        run: python -m pip install ".[build]"
      - name: Construction
        run: python outils/construire.py
      - name: Essai de lancement (5 s)
        shell: bash
        run: python outils/essai_executable.py
      - uses: actions/upload-artifact@v4
        with:
          name: pointeuse-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publier:
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Le tag correspond à la version (src/pointeuse/__init__.py)
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'src'); import pointeuse; print(pointeuse.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ version v${version}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "Pointeuse ${GITHUB_REF_NAME}" --notes-file VERSION.md
