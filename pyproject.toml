[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pointeuse"
version = "0.1.0"
description = "Pointeuse simple Windows/Linux : icône de notification, pointage client/projet/tâche, export CSV"
license = "MIT"
requires-python = ">=3.12"
# PySide6-Essentials : QtCore / Gui / Widgets / DBus / Svg suffisent ; PySide6 « complet » ajouterait
# WebEngine, Qml… (plusieurs centaines de Mo inutiles dans l'exécutable).
dependencies = ["PySide6-Essentials>=6.7", "tomlkit>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
